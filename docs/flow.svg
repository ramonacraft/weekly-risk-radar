<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Weekly Risk Radar flow</title>
  <desc id="desc">Weekly app release and six platforms feed the risk radar, which aims partner tools in parallel with a stakeholder go pack.</desc>

  <rect width="980" height="260" fill="#0f172a" rx="16"/>

  <text x="140" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. App release</text>
  <text x="460" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Risk radar</text>
  <text x="780" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Own the go</text>

  <rect x="40" y="64" width="200" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="96" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Fixed version</text>

  <rect x="40" y="136" width="200" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="168" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">6 app platforms</text>

  <path d="M240 90 C300 90, 320 118, 360 128" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M240 162 C300 162, 320 140, 360 134" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="360,131 348,125 348,137" fill="#94a3b8"/>

  <rect x="370" y="64" width="180" height="52" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="86" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Elevated Regression</text>
  <text x="460" y="104" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Risk</text>

  <rect x="370" y="136" width="180" height="52" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="168" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">P0-P2 (manual)</text>

  <line x1="550" y1="132" x2="610" y2="132" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="610,132 598,126 598,138" fill="#94a3b8"/>

  <rect x="620" y="64" width="160" height="52" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="700" y="96" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Go pack</text>

  <line x1="780" y1="90" x2="820" y2="90" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="820,90 808,84 808,96" fill="#94a3b8"/>

  <rect x="830" y="64" width="120" height="52" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="890" y="86" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fri RC cut</text>
  <text x="890" y="104" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">next Fri submit</text>

  <line x1="700" y1="116" x2="700" y2="148" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"/>
  <rect x="667" y="124" width="66" height="20" rx="6" fill="#334155"/>
  <text x="700" y="138" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">parallel</text>

  <rect x="620" y="156" width="330" height="44" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="785" y="184" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">TestMCP · ForgeQA · Gate · War Room</text>

  <text x="140" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Pillars + tickets in one version</text>
  <text x="460" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Blast radius, not full library</text>
  <text x="785" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Product owns outcome · tools aim work</text>
</svg>
